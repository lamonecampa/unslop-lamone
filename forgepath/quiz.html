<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis & Evaluasi — ForgePath</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--paper:#f4f3ee;--panel:#fffefa;--ink:#20231f;--muted:#70756d;--line:#dcded5;--green:#246b4b;--sans:"DM Sans",sans-serif;--display:"Manrope",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}a{color:var(--green);text-decoration:none}.wrap{max-width:850px;margin:auto;padding:0 22px}header{padding:20px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between}.brand{font:800 18px var(--display);color:var(--ink)}.hero{padding:50px 0 24px}.eyebrow{font:11px "DM Mono",monospace;color:var(--green)}h1{font:800 clamp(35px,6vw,52px)/1.1 var(--display);letter-spacing:-2px;margin:10px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin:14px 0}.q{padding:17px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}.q p{font-weight:700}.q label{display:block;font-size:13px;padding:7px 9px;border-radius:6px;cursor:pointer}.q label:hover{background:#edf1e9}button{border:0;border-radius:7px;padding:11px 16px;background:var(--green);color:white;font-weight:700;cursor:pointer}.result{font-weight:700;margin-top:14px}.muted{color:var(--muted);font-size:12px}
</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html">ForgePath / Evaluasi</a><a href="index.html">← Portal utama</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Knowledge check · 12 pertanyaan</div><h1>Uji pemahaman, bukan hafalan.</h1><p>Evaluasi dasar web, HTML, logika, PHP, SQL, dan Laravel. Kerjakan tanpa melihat catatan terlebih dahulu, lalu baca pembahasannya.</p></section><form id="quiz" class="panel"><div id="questions"></div><button type="submit">Periksa jawaban</button><button type="button" id="retry" style="background:#e8eee5;color:#246b4b">Ulangi kuis</button><div id="result" class="result" aria-live="polite"></div></form></main><script>
const data=[
['Apa fungsi utama HTML?',['Mengatur struktur konten halaman','Menyimpan data di server','Menjalankan query database','Mengelola request PHP'],0,'HTML memberi struktur dan makna pada konten halaman.'],
['Apa tugas CSS?',['Mengirim email','Mengatur tampilan dan layout','Menyimpan data permanen','Mengompilasi PHP'],1,'CSS mengatur warna, tipografi, jarak, dan tata letak.'],
['PHP umumnya dijalankan di mana?',['Di server','Di monitor','Di database','Di DNS'],0,'PHP diproses di server, lalu hasilnya dikirim ke browser.'],
['Apa output dari $x = 2; echo $x + 3; ?',['23','5','x + 3','Error selalu terjadi'],1,'Operator + menjumlahkan angka 2 dan 3.'],
['Struktur apa yang tepat untuk pengambilan keputusan di PHP?',['repeat/until','if/else','SELECT/WHERE','CREATE/ALTER'],1,'if/else menjalankan blok berbeda berdasarkan kondisi.'],
['Apa kegunaan function?',['Menghapus database','Mengemas instruksi agar dapat dipakai ulang','Mengubah HTML menjadi CSS','Membuat domain'],1,'Function membuat kode lebih terstruktur dan dapat digunakan ulang.'],
['Perintah SQL untuk membaca data adalah…',['INSERT','UPDATE','SELECT','DROP'],2,'SELECT mengambil data dari satu atau lebih tabel.'],
['Apa fungsi primary key?',['Memberi identitas unik pada setiap baris','Menyimpan file gambar','Mengenkripsi seluruh tabel','Mengurutkan semua kolom otomatis'],0,'Primary key mengidentifikasi record secara unik.'],
['Apa tujuan JOIN?',['Menghapus kolom','Menggabungkan data dari tabel terkait','Membuat folder proyek','Mengganti password'],1,'JOIN menghubungkan baris dari beberapa tabel berdasarkan kondisi relasi.'],
['Apa risiko menyusun SQL dengan menggabungkan input mentah pengguna?',['SQL injection','Responsive layout','Cache miss','DNS lookup'],0,'Gunakan prepared statements atau parameter binding.'],
['Laravel adalah…',['Bahasa markup','Framework PHP','Database relasional','Web browser'],1,'Laravel adalah framework aplikasi web berbasis PHP.'],
['Apa arti MVC?',['Model, View, Controller','Main, Variable, Class','Module, Version, Cache','Method, Value, Code'],0,'MVC memisahkan representasi data, tampilan, dan pengendali alur aplikasi.']
];const root=document.getElementById('questions');data.forEach((q,i)=>{const el=document.createElement('section');el.className='q';el.innerHTML='<p>'+(i+1)+'. '+q[0]+'</p>'+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+a+'</label>').join('')+'<div class="muted" id="ex'+i+'"></div>';root.appendChild(el)});document.getElementById('quiz').onsubmit=e=>{e.preventDefault();let score=0;data.forEach((q,i)=>{const v=document.querySelector('input[name="q'+i+'"]:checked');const ok=v&&Number(v.value)===q[2];if(ok)score++;document.getElementById('ex'+i).textContent=(ok?'Benar. ':'Belum tepat. ')+q[3]});document.getElementById('result').textContent='Skor: '+score+'/'+data.length+' ('+Math.round(score/data.length*100)+'%). '+(score>=10?'Fondasi cukup kuat. Lanjutkan ke proyek.':score>=7?'Cukup, tetapi ulangi bagian yang masih salah.':'Ulangi materi dasar sebelum melanjutkan.');};document.getElementById('retry').onclick=()=>{document.getElementById('quiz').reset();document.getElementById('result').textContent='';data.forEach((q,i)=>document.getElementById('ex'+i).textContent='')};
</script></body></html>
